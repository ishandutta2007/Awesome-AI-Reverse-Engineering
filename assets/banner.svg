<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b185ff" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dynamic Flow Pulse Animation -->
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      .flow-path {
        stroke-dasharray: 8 12;
        animation: dashFlow 8s linear infinite;
      }
      .flow-path-fast {
        stroke-dasharray: 6 10;
        animation: dashFlow 4s linear infinite;
      }
      .node-pulse-1 {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: 180px 180px;
      }
      .node-pulse-2 {
        animation: pulseNode 3.5s ease-in-out infinite 1s;
        transform-origin: 1020px 180px;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
      .scanner { animation: scanBeam 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Subtle Circuit / Matrix Grid in Background -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Left Dynamic System (Binary / Decompilation Engine Flow) -->
  <g opacity="0.45">
    <path d="M 60 180 Q 120 80 180 180 T 300 180" fill="none" stroke="#00f2fe" stroke-width="2" class="flow-path" />
    <path d="M 80 250 Q 140 310 180 180 T 280 100" fill="none" stroke="#7928ca" stroke-width="1.5" class="flow-path-fast" />
    <circle cx="180" cy="180" r="32" fill="none" stroke="#00f2fe" stroke-width="1.5" class="node-pulse-1" filter="url(#glow)" />
    <circle cx="180" cy="180" r="6" fill="#00f2fe" />
    <text x="180" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4facfe" text-anchor="middle" letter-spacing="1">HEX / BINARY</text>
  </g>

  <!-- Right Dynamic System (Agent / AI Reconstruction Flow) -->
  <g opacity="0.45">
    <path d="M 900 180 Q 960 280 1020 180 T 1140 180" fill="none" stroke="#b185ff" stroke-width="2" class="flow-path" />
    <path d="M 920 110 Q 980 50 1020 180 T 1120 260" fill="none" stroke="#4facfe" stroke-width="1.5" class="flow-path-fast" />
    <circle cx="1020" cy="180" r="32" fill="none" stroke="#b185ff" stroke-width="1.5" class="node-pulse-2" filter="url(#glow)" />
    <circle cx="1020" cy="180" r="6" fill="#f72585" />
    <text x="1020" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#b185ff" text-anchor="middle" letter-spacing="1">AI RECONSTRUCTION</text>
  </g>

  <!-- Floating Ambient Data Particles -->
  <g>
    <circle cx="260" cy="90" r="3.5" fill="#00f2fe" class="particle-1" />
    <circle cx="340" cy="270" r="2.5" fill="#4facfe" class="particle-2" />
    <circle cx="940" cy="90" r="3" fill="#b185ff" class="particle-3" />
    <circle cx="860" cy="280" r="2.5" fill="#f72585" class="particle-1" />
  </g>

  <!-- Subtle Laser Scan Line -->
  <g class="scanner">
    <line x1="100" y1="0" x2="1100" y2="0" stroke="url(#accent-cyan)" stroke-width="1.5" filter="url(#glow)" />
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="440" y="42" width="320" height="30" rx="15" fill="#1b2a4a" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
    <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#00f2fe" letter-spacing="1.5">⚡ NEXT-GEN REVERSE ENGINEERING</text>

    <!-- Main Title -->
    <text x="600" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      Awesome AI Reverse Engineering
    </text>

    <!-- Subtitle -->
    <text x="600" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="17" fill="#94a3b8">
      Curated Ecosystem for Agent-Assisted Binary Analysis, Decompilation &amp; Reconstruction
    </text>

    <!-- Capabilities Category Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <rect x="250" y="0" width="150" height="34" rx="8" fill="#162238" stroke="#334155" stroke-width="1" />
      <text x="325" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">🤖 Agent Workflows</text>

      <!-- Pill 2 -->
      <rect x="420" y="0" width="165" height="34" rx="8" fill="#162238" stroke="#334155" stroke-width="1" />
      <text x="502" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#a78bfa">🔍 Binary Decompilation</text>

      <!-- Pill 3 -->
      <rect x="605" y="0" width="165" height="34" rx="8" fill="#162238" stroke="#334155" stroke-width="1" />
      <text x="687" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#34d399">🧩 MCP Tool Servers</text>

      <!-- Pill 4 -->
      <rect x="790" y="0" width="160" height="34" rx="8" fill="#162238" stroke="#334155" stroke-width="1" />
      <text x="870" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f472b6">🛡️ Malware Triage</text>
    </g>

    <!-- Bottom Tagline -->
    <text x="600" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748b" letter-spacing="0.5">
      IDA Pro • Ghidra • REA • Binary Ninja • JEB • Radare2 • Angr • Cutter • Qiling • Frida
    </text>
  </g>
</svg>
